.matrix-toggle{display:inline-grid;place-items:center;vertical-align:middle;width:25px;height:25px;padding:0;margin-right:5px;border:1px solid #9bb8ac;border-radius:4px;background:#fff;color:var(--g);font-size:18px;line-height:1}
.matrix-toggle:focus-visible{outline:2px solid var(--g);outline-offset:2px}.matrix-wrap{max-height:65dvh}
@media(max-width:600px){.drc-matrix{min-width:510px;font-size:12px}.drc-matrix td,.drc-matrix th{padding:8px 7px}.matrix-toggle{width:30px;height:30px}.matrix-indent{padding-left:25px}}

<script>
// ===== DEMO: du lieu gia trong trinh duyet, khong can server =====
(() => {
  const today = new Date(Date.now()+7*3600e3); const p2=n=>String(n).padStart(2,'0');
  const TODAY = `${p2(today.getUTCDate())}/${p2(today.getUTCMonth()+1)}/${today.getUTCFullYear()}`;
  const yd = new Date(today.getTime()-86400e3); const YD = `${p2(yd.getUTCDate())}/${p2(yd.getUTCMonth()+1)}/${yd.getUTCFullYear()}`;
  const KV=[['IK_KV1','Ia Ko','KV1'],['IK_KV2','Ia Ko','KV2'],['IK_KV3','Ia Ko','KV3'],['IT_KV1','Ia Tiêm','KV1'],['IT_KV2','Ia Tiêm','KV2']].map(([ma,doi,kv])=>({ma,doi,kv,label:doi+'-'+kv}));
  const lab=Object.fromEntries(KV.map(k=>[k.ma,k.label]));
  let logged=false, seq=3, email='demo@local', dataformStarted=0, dataformRawId=null;
  let phieu=[
    {id:'history1',ngay:YD,codes:['IK_KV1','IK_KV2'],loaiMu:'Mủ tạp đông',khoiLuongPGN:175,sanLuongTo:null,lanDo:1,drcPercent:39,danhGia:'Loại I',ghiChu:'Dữ liệu demo ngày trước'},
    {id:'p1',ngay:TODAY,codes:['IK_KV1'],loaiMu:'Mủ nước',lanDo:1,khoiLuongPGN:3100,sanLuongTo:3100,drcPercent:21.5,danhGia:'Loại I',ghiChu:''},
    {id:'p2',ngay:TODAY,codes:['IK_KV2'],loaiMu:'Mủ nước',lanDo:1,khoiLuongPGN:2840,sanLuongTo:2900,drcPercent:22.3,danhGia:'Loại I',ghiChu:'Mưa sáng'},
  ];
  const th=[
    {id:'a',ngay:TODAY,khuVuc:'Ia Ko-KV1',loaiMu:'Mủ nước',lanDo:1,drcPercent:21.5,danhGia:'Loại I'},
    {id:'b',ngay:TODAY,khuVuc:'Ia Ko-KV2',loaiMu:'Mủ nước',lanDo:1,drcPercent:22.3,danhGia:'Loại I'},
    {id:'c',ngay:YD,khuVuc:'Ia Ko-KV1',loaiMu:'Mủ nước',lanDo:1,drcPercent:21.8,danhGia:'Loại I'},
    {id:'d',ngay:YD,khuVuc:'Ia Tiêm-KV1',loaiMu:'Mủ tạp đông',lanDo:1,drcPercent:38,danhGia:'Loại I'},
  ];
  const accounts=[{email:'demo@local',role:'user',mustChange:false,demoPassword:'DrcDemo2026!'},{email:'admin@local',role:'admin',mustChange:false,demoPassword:'DrcDemo2026!'}];
  async function demoHash(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:100000},key,256);return Array.from(new Uint8Array(bits),x=>x.toString(16).padStart(2,'0')).join('');}
  const passwordsReady=Promise.all(accounts.map(async a=>{a.salt=crypto.getRandomValues(new Uint8Array(16));a.hash=await demoHash('DrcDemo2026!',a.salt);}));
  let rawState={state:'IDLE'},rawStarted=0,rawQuota={date:TODAY,used:0};
  try{const q=JSON.parse(localStorage.getItem('drc-raw-quota'));if(q?.date===TODAY)rawQuota=q;}catch(_){}
  const rawQuotaFor=()=>({...rawQuota,limit:2,canRun:rawQuota.used<(email==='admin@local'?2:1),reason:rawQuota.used>=2?'Hôm nay đã dùng hết 2 lượt của bước này':rawQuota.used>=1&&email!=='admin@local'?'Lượt thứ hai cần đăng nhập admin':''});
  const rawStatus=()=>{if(rawState.state==='RUNNING'&&Date.now()-rawStarted>=1500)rawState={...rawState,state:'SUCCEEDED',date:TODAY,signature:JSON.stringify(phieu)};if(rawState.state==='SUCCEEDED'&&rawState.signature!==JSON.stringify(phieu))rawState.state='STALE';return rawState;};
  let dataformQuota={date:TODAY,used:0};
  try{const saved=JSON.parse(localStorage.getItem('drc-dataform-quota'));if(saved?.date===TODAY)dataformQuota=saved;}catch(_){}
  const view=p=>({...p,khuVuc:p.codes.map(c=>lab[c]||c),lanDo:1});
  const J=(o,s=200)=>new Response(JSON.stringify(o),{status:s,headers:{'content-type':'application/json'}});
  const real=window.fetch;
  window.fetch=async(url,o={})=>{
    if(!String(url).startsWith('/api/')) return real(url,o);
    await new Promise(r=>setTimeout(r,150));
    await passwordsReady;
    const m=(o.method||'GET').toUpperCase(), b=o.body?JSON.parse(o.body):{};
    if(url==='/api/config') return J({googleClientId:'',mock:true});
    if(url==='/api/login'){const account=accounts.find(a=>a.email===String(b.email||'').trim().toLowerCase());if(!account||typeof b.password!=='string'||await demoHash(b.password,account.salt)!==account.hash)return J({error:'Tài khoản hoặc mật khẩu không đúng'},401);logged=true;email=account.email;return J({email,role:account.role});}
    if(url==='/api/logout'){logged=false;return J({ok:true});}
    if(!logged)return J({error:'Chưa đăng nhập'},401);
    if(url==='/api/password'&&m==='PUT'){
      if(email==='admin@local')return J({error:'Mật khẩu admin được giữ cố định'},403);
      const account=accounts.find(a=>a.email===email);
      if(typeof b.currentPassword!=='string'||await demoHash(b.currentPassword,account.salt)!==account.hash)return J({error:'Mật khẩu hiện tại không đúng'},400);
      if(typeof b.password!=='string'||b.password.length<10||b.password.length>128)return J({error:'Mật khẩu cần từ 10 đến 128 ký tự'},400);
      if(b.password===b.currentPassword)return J({error:'Mật khẩu mới phải khác mật khẩu hiện tại'},400);
      account.salt=crypto.getRandomValues(new Uint8Array(16));account.hash=await demoHash(b.password,account.salt);account.mustChange=false;account.demoPassword=b.password;return J({ok:true});
    }
    if(url==='/api/raw-sync'){
      if(m==='POST'&&rawStatus().state!=='RUNNING'){if(dataformStarted&&Date.now()-dataformStarted<4000)return J({error:'Dataform đang chạy. Hãy đợi hoàn tất'},409);const q=rawQuotaFor();if(!q.canRun)return J({error:q.reason},q.used>=2?429:403);rawQuota.used++;try{localStorage.setItem('drc-raw-quota',JSON.stringify(rawQuota));}catch(_){}rawStarted=Date.now();rawState={state:'RUNNING',id:'raw-'+rawStarted};}
      return J({...rawStatus(),mock:true,quota:rawQuotaFor()});
    }
    if(url==='/api/dataform'){
      const role=email==='admin@local'?'admin':'user';
      const date=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date());
      if(dataformQuota.date!==date)dataformQuota={date,used:0};
      const quota=()=>({...dataformQuota,limit:2,canRun:dataformQuota.used<(role==='admin'?2:1),reason:dataformQuota.used>=2?'Hôm nay đã dùng hết 2 lượt chạy':dataformQuota.used>=1&&role!=='admin'?'Lượt thứ hai cần đăng nhập admin':''});
      const running=dataformStarted&&Date.now()-dataformStarted<4000;
      if(m==='POST'&&!running){if(rawStatus().state!=='SUCCEEDED')return J({error:'Cần đẩy 4 tab lên RAW thành công trước khi chạy Dataform'},409);const q=quota();if(!q.canRun)return J({error:q.reason,quota:q},q.used>=2?429:403);dataformQuota.used++;try{localStorage.setItem('drc-dataform-quota',JSON.stringify(dataformQuota));}catch(_){}dataformStarted=Date.now();dataformRawId=rawState.id;}
      return J({configured:true,mock:true,state:!dataformStarted?'IDLE':Date.now()-dataformStarted<4000?'RUNNING':'SUCCEEDED',quota:quota(),raw:{...rawStatus(),quota:rawQuotaFor()},sourceRawRunId:dataformRawId,alreadyRunning:m==='POST'&&!!running});
    }
    if(url==='/api/admin/reveal-password'){if(email!=='admin@local')return J({error:'Chỉ admin được xem mật khẩu'},403);const a=accounts.find(x=>x.email===b.email);if(!a)return J({error:'Không tìm thấy tài khoản'},404);if(a.role==='admin')return J({error:'Không hiển thị mật khẩu admin'},403);return J({password:a.demoPassword});}
    if(url==='/api/admin/users'){if(email!=='admin@local')return J({error:'Chỉ admin được quản lý tài khoản'},403);return J(accounts.map(a=>({email:a.email,role:a.role,units:['Chư Sê'],hasPassword:true})));}
    if(url==='/api/admin/password'&&m==='PUT'){if(email!=='admin@local')return J({error:'Chỉ admin được quản lý tài khoản'},403);const account=accounts.find(a=>a.email===b.email);if(account?.role==='admin')return J({error:'Mật khẩu admin được giữ cố định'},403);if(!account)return J({error:'Không tìm thấy tài khoản'},404);if(typeof b.password!=='string'||b.password.length<10||b.password.length>128)return J({error:'Mật khẩu cần từ 10 đến 128 ký tự'},400);account.salt=crypto.getRandomValues(new Uint8Array(16));account.hash=await demoHash(b.password,account.salt);account.mustChange=false;account.demoPassword=b.password;const relogin=email===b.email;if(relogin)logged=false;return J({ok:true,relogin});}
    if(url==='/api/me') return J({email,mustChangePassword:accounts.find(a=>a.email===email).mustChange,role:email==='admin@local'?'admin':'user',donvi:'Chư Sê',khuVuc:KV,loaiMu:['Mủ nước','Mủ tạp đông','Mủ đông chén','Mủ đông khối','Mủ dây','Mủ ngoại lệ'],danhGia:['Loại I','Loại II'],today:TODAY});
    if(url==='/api/sanluong') return J(KV.map((k,i)=>[k.ma,TODAY,[3100,2900,0,1250,5775][i],[175,66,0,26,66][i],600,100,50]));
    if(url.startsWith('/api/tonghop?')) { const date=new URLSearchParams(url.split('?')[1]).get('date')||TODAY; return J(phieu.filter(p=>p.ngay===date).flatMap(p=>p.codes.map(code=>({id:p.id+'_'+code,ngay:p.ngay,code,khuVuc:lab[code]||code,loaiMu:p.loaiMu,lanDo:1,drcPercent:p.drcPercent,danhGia:p.danhGia})))); }
    if(url.startsWith('/api/phieu?')&&m==='GET'){const date=new URLSearchParams(url.split('?')[1]).get('date')||TODAY;return J(phieu.filter(p=>p.ngay===date).map(view).reverse());}
    const codes=[].concat(b.maKhuVuc||[]);
    const bad=()=>{ if(!b.loaiMu) return 'Chọn loại mủ'; if(!codes.length) return 'Chưa chọn khu vực'; if(!(+b.khoiLuongPGN>0)) return 'Khối lượng PGN phải lớn hơn 0'; if(!(+b.drcPercent>0&&+b.drcPercent<=100)) return 'DRC phải trong khoảng 0–100 (%)'; };
    const dup=id=>phieu.find(x=>x.id!==id&&x.ngay===(id ? phieu.find(p=>p.id===id)?.ngay : TODAY)&&x.loaiMu===b.loaiMu&&x.codes.some(c=>codes.includes(c)));
    const fill=x=>Object.assign(x,{codes,lanDo:1,loaiMu:b.loaiMu,khoiLuongPGN:+b.khoiLuongPGN,drcPercent:+b.drcPercent,danhGia:b.danhGia,ghiChu:b.ghiChu||'',sanLuongTo:(()=>{const col={'Mủ nước':2,'Mủ tạp đông':3,'Mủ đông chén':4,'Mủ đông khối':5,'Mủ dây':6}[b.loaiMu];return col===undefined?null:codes.reduce((sum,c)=>{const i=KV.findIndex(k=>k.ma===c);return sum+([k=>0,k=>0,i=>[3100,2900,0,1250,5775][i],i=>[175,66,0,26,66][i],i=>600,i=>100,i=>50][col])(i);},0);})()});
    if(url==='/api/phieu'&&m==='POST'){ if(bad()) return J({error:bad()},400); if(dup()) return J({error:'Đã có phiếu đo cho khu vực/loại mủ này trong ngày. Hãy mở phiếu đó để sửa.'},409); phieu.push(fill({id:'p'+(++seq),ngay:TODAY})); return J({id:'p'+seq},201); }
    const id=url.split('/').pop(), x=phieu.find(q=>q.id===id);
    if(!x) return J({error:'Không tìm thấy phiếu'},404);
    const dateMs=d=>Date.UTC(...d.split('/').reverse().map((n,i)=>Number(n)-(i===1?1:0)));
    const age=(dateMs(TODAY)-dateMs(x.ngay))/86400000;
    if(age<0 || age>(m==='PUT'&&email==='admin@local'?3:0)) return J({error:'Không có quyền sửa/xóa phiếu ngày này'},403);
    if(m==='PUT'){ if(bad()) return J({error:bad()},400); if(dup(id)) return J({error:'Đã có phiếu khác trùng khu vực/loại mủ trong ngày'},409); fill(x); return J({ok:true}); }
    if(m==='DELETE'){ phieu=phieu.filter(q=>q.id!==id); return J({ok:true}); }
  };
})();
</script>

  function renderTongHop() {

      const team=area?.doi||'Đội chưa xác định',code=area?.ma||t.code||t.khuVuc;

      const grades=[...new Set(rows.map(r=>r.danhGia).filter(Boolean))].sort(sort);

    let index=0;
    const body=[...teams].sort((a,b)=>sort(a[0],b[0])).map(([team,areas])=>{
      const group='matrix-team-'+index++,all=[...areas.values()].flatMap(a=>a.rows),types=[...new Set(all.map(r=>r.loaiMu))].sort(sort);
      const parent=types.map((type,i)=>'<tr class="matrix-parent"><td>'+(i===0?'<button type="button" class="matrix-toggle" data-group="'+group+'" aria-expanded="true" aria-label="Thu gọn đội '+esc(team)+'"><span aria-hidden="true">−</span></button> <strong>'+esc(team)+'</strong>':'')+'</td>'+cells({loaiMu:type,...aggregate(all.filter(r=>r.loaiMu===type))})+'</tr>').join('');

      return parent+children;
    }).join('');
    main.innerHTML='<div class="daygrp">'+esc(date)+'</div>'+(teams.size?'<div class="table-wrap matrix-wrap"><table class="drc-matrix"><thead><tr><th scope="col">Đội – Khu vực</th><th scope="col">Loại mủ</th><th scope="col" class="num">DRC</th><th scope="col" class="num">Khối lượng KV nhập (kg)</th><th scope="col">Loại</th></tr></thead><tbody>'+body+'</tbody></table></div>':'<div class="empty">Chưa có dữ liệu tổng hợp cho ngày đã chọn.</div>');
    main.querySelectorAll('.matrix-toggle').forEach(button=>button.onclick=()=>{
      const open=button.getAttribute('aria-expanded')!=='true';
      button.setAttribute('aria-expanded',String(open));button.querySelector('span').textContent=open?'−':'+';
      button.setAttribute('aria-label',(open?'Thu gọn':'Mở')+' đội '+button.parentElement.querySelector('strong').textContent);
      main.querySelectorAll('[data-parent="'+button.dataset.group+'"]').forEach(row=>row.hidden=!open);
    });
  }

async function renderAccounts(){const main=document.getElementById('main');if(S.me.role!=='admin'){main.textContent='Bạn không có quyền';return;}const users=await api('GET','/api/admin/users');main.innerHTML=`<div class="table-wrap"><table style="min-width:650px"><thead><tr><th>Tài khoản</th><th>Đơn vị</th><th>Vai trò</th><th>Mật khẩu</th><th>Thao tác</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.units.join(' · '))}</td><td>${esc(u.role)}</td><td>${u.role==='admin'?'Cố định':'<span class="account-secret">••••••••</span>'}${u.role!=='admin'?` <button class="edit-button" data-reveal="${esc(u.email)}">Xem mật khẩu</button>`:''}</td><td>${u.role!=='admin'?`<button class="edit-button" data-email="${esc(u.email)}">Đặt mật khẩu</button>`:'–'}</td></tr>`).join('')}</tbody></table></div>`;main.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=async()=>{const span=b.parentElement.querySelector('.account-secret');if(b.dataset.visible==='true'){span.textContent='••••••••';b.dataset.visible='false';b.textContent='Xem mật khẩu';return;}b.disabled=true;try{const r=await api('POST','/api/admin/reveal-password',{email:b.dataset.reveal});span.textContent=r.password;b.dataset.visible='true';b.textContent='Ẩn mật khẩu';}catch(e){toast(e.message);}finally{b.disabled=false;}});main.querySelectorAll('[data-email]').forEach(b=>b.onclick=()=>{const email=b.dataset.email,m=document.createElement('div');m.className='modal';m.innerHTML=`<form class="sheet"><h2>Đặt mật khẩu</h2><p>${esc(email)}</p><label for="new-password">Mật khẩu mới</label><input type="password" id="new-password" minlength="10" maxlength="128" autocomplete="new-password" required><label for="confirm-password">Nhập lại mật khẩu</label><input type="password" id="confirm-password" minlength="10" maxlength="128" autocomplete="new-password" required><div class="err" role="alert"></div><div class="btns"><button type="button" id="password-cancel">Hủy</button><button class="pri">Lưu mật khẩu</button></div></form>`;document.body.appendChild(m);enhancePasswordFields(m);m.querySelector('#password-cancel').onclick=()=>m.remove();m.querySelector('form').onsubmit=async e=>{e.preventDefault();const password=m.querySelector('#new-password').value,err=m.querySelector('.err');if(password!==m.querySelector('#confirm-password').value){err.textContent='Mật khẩu nhập lại không khớp';return;}const save=m.querySelector('.pri');save.disabled=true;try{const r=await api('PUT','/api/admin/password',{email,password});m.remove();if(r.relogin){S.me=null;S.tab='phieu';renderLogin('Mật khẩu đã thay đổi. Vui lòng đăng nhập lại');}else{toast('Đã lưu mật khẩu');await renderAccounts();}}catch(ex){err.textContent=ex.message;save.disabled=false;}};});}
  // ---------- Form phieu do ----------
  function openForm(edit) {
    if (edit && !canEdit(edit.ngay)) return;
    const me = S.me;
    const numeric = value => String(value).trim().replace(',', '.');
    const cleanNumeric = input => { input.value = input.value.replace(/[^0-9.,]/g, ''); };
    const st = {
      loaiMu: edit ? edit.loaiMu : '', codes: edit ? [...edit.codes] : [],
      danhGia: edit ? edit.danhGia : 'Loại II', danhGiaManual: !!edit,
    };
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<form class="sheet" novalidate>
      <h2>${edit ? 'Sửa phiếu đo' : 'Thêm phiếu đo DRC'}</h2>
      <label>Ngày</label><input type="text" value="${esc(edit ? edit.ngay : me.today)}" readonly>
      <label>Loại mủ *</label><div class="opts" id="f-mu"></div>
      <div id="f-kvwrap"><label id="f-kvlabel">Khu vực *</label><div class="kvbox" id="f-kv"></div></div>
      <label>Sản lượng khu vực nhập</label><input type="text" id="f-slkv" value="Chọn đội – khu vực và loại mủ" readonly><div class="mut" id="f-sl-detail"></div>
      <label>${icon('scale')}Sản lượng phiếu giao nhận (PGN) *</label><input type="text" id="f-pgn" inputmode="decimal" autocomplete="off" value="${edit ? esc(edit.khoiLuongPGN) : ''}">
      <div id="f-warning" class="warning" role="status" aria-live="polite"></div>
      <label>${icon('drop')}DRC (%) *</label><input type="text" id="f-drc" inputmode="decimal" autocomplete="off" value="${edit ? esc(edit.drcPercent) : ''}">
      <label>Đánh giá</label><div class="opts" id="f-dg"></div>
      <label>${icon('note')}Ghi chú</label><input type="text" id="f-note" inputmode="text" maxlength="500" value="${edit ? esc(edit.ghiChu) : ''}">
      <div class="err" id="f-err"></div>
      <div class="btns">${edit && edit.ngay === me.today ? '<button type="button" class="del" id="f-del">Xóa</button>' : ''}<button type="button" id="f-cancel">Hủy</button><button class="pri" id="f-save">Lưu</button></div>
    </form>`;
    document.body.appendChild(m);
    const $ = (id) => m.querySelector('#' + id);

    let production = [], productionLoaded = false, productionError = '';
    let actual = null;
    const updateProduction = () => {
      actual = null;
      $('f-sl-detail').textContent = '';
      if (!st.codes.length || !st.loaiMu) { $('f-slkv').value = 'Chọn đội – khu vực và loại mủ'; $('f-warning').textContent = ''; return; }
      const col = {'Mủ nước':2,'Mủ tạp đông':3,'Mủ đông chén':4,'Mủ đông khối':5,'Mủ dây':6}[st.loaiMu];
      const values = st.codes.map(code => {
        const r = production.find(r => String(r[0]) === code && String(r[1]) === (edit ? edit.ngay : me.today));
        const v = r && col !== undefined ? r[col] : null;
        return {code, value: v === null || v === undefined || v === '' || !Number.isFinite(Number(v)) ? null : Number(v)};
      });
      if (productionLoaded && values.every(v => v.value !== null)) actual = values.reduce((sum,v) => sum + v.value, 0);
      $('f-slkv').value = actual === null ? (productionError || (productionLoaded ? 'Chưa có dữ liệu sản lượng' : 'Đang tải…')) : fmt(actual);
      $('f-sl-detail').textContent = st.codes.length > 1 ? values.map(v => (me.khuVuc.find(k=>k.ma===v.code)?.label || v.code) + ': ' + fmt(v.value)).join(' · ') : '';
      $('f-warning').textContent = warning(actual, numeric($('f-pgn').value));
    };
    $('f-pgn').oninput = () => { cleanNumeric($('f-pgn')); updateProduction(); };
    api('GET', '/api/sanluong').then(rows => {production = rows; productionLoaded = true; updateProduction();}).catch(() => {productionLoaded = true; productionError = 'Không tải được sản lượng'; updateProduction();});
    const drawMu = () => {
      $('f-mu').innerHTML = me.loaiMu.map((x) => `<button type="button" class="opt ${st.loaiMu === x ? 'on' : ''}" data-v="${esc(x)}">${esc(x)}</button>`).join('');
      $('f-mu').querySelectorAll('.opt').forEach((b) => (b.onclick = () => {
        st.loaiMu = b.dataset.v; if (st.loaiMu === 'Mủ nước' && st.codes.length > 1) st.codes = [st.codes[0]];
        drawMu(); drawKv(); updateProduction();
      }));
    };
    const drawKv = () => {
      const single = st.loaiMu === 'Mủ nước';
      $('f-kvlabel').textContent = single ? 'Khu vực * (mủ nước: mỗi khu vực một phiếu)' : 'Khu vực * (có thể chọn nhiều đội dùng chung DRC)';
      $('f-kv').innerHTML = me.khuVuc.map((k) => `<label><input type="${single ? 'radio' : 'checkbox'}" name="kv" value="${esc(k.ma)}" ${st.codes.includes(k.ma) ? 'checked' : ''}>${esc(k.label)}</label>`).join('');
      $('f-kv').querySelectorAll('input').forEach((i) => (i.onchange = () => {
        st.codes = single ? [i.value] : [...$('f-kv').querySelectorAll('input:checked')].map((x) => x.value); updateProduction();
      }));
    };
    const drawDg = () => {
      $('f-dg').innerHTML = me.danhGia.map((x) => `<button type="button" class="opt ${st.danhGia === x ? 'on' : ''}" data-v="${esc(x)}">${esc(x)}</button>`).join('');
      $('f-dg').querySelectorAll('.opt').forEach((b) => (b.onclick = () => { st.danhGia = b.dataset.v; st.danhGiaManual = true; drawDg(); }));
    };
    $('f-drc').oninput = () => {
      cleanNumeric($('f-drc'));
      const value = numeric($('f-drc').value);
      if (!st.danhGiaManual && value !== '' && Number.isFinite(Number(value))) { st.danhGia = Number(value) < 20 ? 'Loại II' : 'Loại I'; drawDg(); }
    };
    drawMu(); drawKv(); drawDg(); updateProduction();

    const close = () => m.remove();
    $('f-cancel').onclick = close;
    m.onclick = (e) => { if (e.target === m) close(); };
    const lock = (on) => m.querySelectorAll('button').forEach((b) => (b.disabled = on));

    if (edit && $('f-del')) $('f-del').onclick = async () => {
      if (!confirm('Xóa phiếu đo này?')) return;
      lock(true);
      try { await api('DELETE', '/api/phieu/' + edit.id); close(); toast('Đã xóa'); loadTab(); }
      catch (e) { $('f-err').textContent = e.message; lock(false); }
    };
    m.querySelector('form').onsubmit = async (e) => {
      e.preventDefault();
      $('f-err').textContent = '';
      if (!st.loaiMu) return ($('f-err').textContent = 'Chọn loại mủ');
      if (!st.codes.length) return ($('f-err').textContent = 'Chọn khu vực');
      const body = { loaiMu: st.loaiMu, maKhuVuc: st.codes, khoiLuongPGN: numeric($('f-pgn').value), drcPercent: numeric($('f-drc').value), danhGia: st.danhGia, ghiChu: $('f-note').value };
      lock(true); // chong bam Luu 2 lan
      try {
        await api(edit ? 'PUT' : 'POST', edit ? '/api/phieu/' + edit.id : '/api/phieu', body);
        close(); toast('Đã lưu'); S.tab = 'phieu'; S.date = edit ? edit.ngay : S.me.today; loadTab();
      } catch (e2) { $('f-err').textContent = e2.message; lock(false); }
    };
  }

  // ---------- khoi dong ----------
  (async () => {
    S.cfg = await fetch('/api/config').then((r) => r.json());
    boot();
  })();
})();
</script>
